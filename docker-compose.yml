# DevAria lean production stack: Postgres + backend + frontend + Caddy (HTTPS).
# Run:  docker compose --profile https up -d --build --remove-orphans
# Only Caddy (80/443) is reachable from the internet. Everything else stays on the internal Docker network.
name: devnexa

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devnexa
      POSTGRES_PASSWORD: devnexa
      POSTGRES_DB: devnexa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnexa"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEVNEXA_DATABASE_URL: postgresql+psycopg://devnexa:devnexa@postgres:5432/devnexa
      DEVNEXA_ENVIRONMENT_MODE: ${DEVNEXA_MODE:-live}
      DEVNEXA_LLM_PROVIDER: ${DEVNEXA_LLM_PROVIDER:-heuristic}
      DEVNEXA_LLM_MODEL: ${DEVNEXA_LLM_MODEL:-claude-sonnet-5-5}
      DEVNEXA_LLM_API_KEY: ${DEVNEXA_LLM_API_KEY:-}
      DEVNEXA_LLM_BASE_URL: ${DEVNEXA_LLM_BASE_URL:-}
      DEVNEXA_GITHUB_WEBHOOK_SECRET: ${DEVNEXA_GITHUB_WEBHOOK_SECRET:-}
      DEVNEXA_GITHUB_REPO: ${DEVNEXA_GITHUB_REPO:-}
      DEVNEXA_ADMIN_TOKEN: ${DEVNEXA_ADMIN_TOKEN:-}
      DEVNEXA_GITHUB_CLIENT_ID: ${DEVNEXA_GITHUB_CLIENT_ID:-}
      DEVNEXA_GITHUB_CLIENT_SECRET: ${DEVNEXA_GITHUB_CLIENT_SECRET:-}
      DEVNEXA_GITHUB_ALLOWED_USERS: ${DEVNEXA_GITHUB_ALLOWED_USERS:-}
      DEVNEXA_GITHUB_SIGNUP: ${DEVNEXA_GITHUB_SIGNUP:-approval}
      DEVNEXA_PUBLIC_URL: ${DEVNEXA_PUBLIC_URL:-}
      DEVNEXA_SESSION_SECRET: ${DEVNEXA_SESSION_SECRET:-}
      DEVNEXA_GITHUB_TOKEN: ${DEVNEXA_GITHUB_TOKEN:-}
      DEVNEXA_APPS_DOMAIN: ${DEVNEXA_APPS_DOMAIN:-}
      DEVNEXA_APPS_PUBLIC_HOST: ${DEVNEXA_DOMAIN:-localhost}
      DEVNEXA_APPS_NETWORK: devnexa_default
      DEVNEXA_BACKUPS_DIR: /var/lib/devnexa/backups
      DEVNEXA_BACKUPS_VOLUME: devnexa-backups
      DEVNEXA_TRASH_DAYS: ${DEVNEXA_TRASH_DAYS:-14}
      DEVNEXA_BACKUP_IMPORT_MAX_MB: ${DEVNEXA_BACKUP_IMPORT_MAX_MB:-2048}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Caddy's access log for deployed apps, read for the dashboard's live traffic view.
      - caddy_logs:/var/log/caddy:ro
      - backups:/var/lib/devnexa/backups

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2.8.4
    profiles: [https]
    restart: unless-stopped
    environment:
      DEVNEXA_DOMAIN: ${DEVNEXA_DOMAIN:-localhost}
    depends_on: [frontend, backend]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  backups:
    name: devnexa-backups
